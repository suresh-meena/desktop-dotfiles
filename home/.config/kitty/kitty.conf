# =============================================================================
# Kitty — High-Performance GPU-Accelerated Config
# Generated 2026-08-21 for Fedora 44 / GNOME Wayland / Intel UHD 620 + NVIDIA MX250
# Goal: maximum speed, minimal latency, full GPU utilization
# =============================================================================

# ---------------------------------------------------------------------------
# Fonts — keep JetBrainsMono Nerd Font (existing) for best glyph coverage
# ---------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Fine-tune font rendering for GPU text composition
# platform = native rendering (Linux: FreeType + HarfBuzz), fastest & sharpest
text_composition_strategy  platform
disable_ligatures          never
font_features              none
box_drawing_scale          0.001, 1, 1.5, 2
underline_exclusion        1.0
# ---------------------------------------------------------------------------
# Performance / GPU — the core of this config
# ---------------------------------------------------------------------------
# Use Wayland natively when available (auto = Wayland on Wayland, X11 on X)
linux_display_server       auto

# Avoid blocking Kitty's UI on the compositor/GPU refresh; this keeps tabs and
# selection responsive if a Wayland/NVIDIA surface stops repainting.
sync_to_monitor            no

# How long to wait before repainting (ms) — 10ms = up to 100 FPS
repaint_delay              10
# Latency between key press and display — 1ms = ultra-low input lag
input_delay                1

# Compositor handling — disable extra desktop effects that cost GPU
background_opacity         0.86
dynamic_background_opacity no
background_blur            0
# Decorations ON — hiding them removes the titlebar on GNOME Wayland,
# which leaves nothing to drag the window with. (Super+drag still works either way.)
hide_window_decorations    no
window_padding_width       2 4
window_border_width        0
draw_minimal_borders       yes
single_window_margin_width -1
placement_strategy         center
enable_audio_bell          no
visual_bell_duration       0.0
update_check_interval      0
confirm_os_window_close    0
remember_window_size       no
initial_window_width       160c
initial_window_height      42c

# Wayland / X11 integration
wayland_titlebar_color     system
macos_titlebar_color       system
# IME off — with no input method running, kitty's Wayland IME path is a known
# source of input hangs/freezes. Set back to `yes` if you type CJK via ibus/fcitx.
wayland_enable_ime         no

# Scrollback — 2000 lines = lowest memory/CPU, still 2k lines history (was 5000)
scrollback_lines           2000
scrollback_pager           less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_fill_enlarged_window no
wheel_scroll_multiplier    5.0
wheel_scroll_min_lines     1
touch_scroll_multiplier    1.0

# ---------------------------------------------------------------------------
# Cursor — beam is fastest to render; hollow when unfocused saves redraws
# ---------------------------------------------------------------------------
cursor_shape               beam
cursor_beam_thickness      1.5
cursor_underline_thickness 2.0
cursor_blink_interval      0
cursor_stop_blinking_after 0
cursor_shape_unfocused     hollow

# ---------------------------------------------------------------------------
# Shell integration & remote control — GPU sprite cache sharing
# ---------------------------------------------------------------------------
shell_integration          enabled
# Remote control restricted to the private per-instance socket in XDG_RUNTIME_DIR.
# The old `listen_on unix:/tmp/mykitty` was world-accessible, and kitty processes
# remote-control requests on the main loop — a stray/stale client could wedge the UI.
allow_remote_control       socket-only
clipboard_control          write-clipboard write-primary read-clipboard-ask read-primary-ask
strip_trailing_spaces      smart
select_by_word_characters  :@-./_~?&=%+#
copy_on_select             no
open_url_with              default

# ---------------------------------------------------------------------------
# Tabs / Windows — uniform, desaturated, subtle boundary
# ---------------------------------------------------------------------------
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_align              left
tab_bar_min_tabs           1
tab_switch_strategy        previous
active_tab_font_style      bold
inactive_tab_font_style    normal
bell_on_tab                no
# Uniform width: every tab is " N: title       " padded/truncated to 14 chars
tab_separator              " │ "
tab_title_template         " {index}: {title[:14]:<14} "
active_tab_title_template  none
# Very unsaturated tab colors — nearly grey, active barely lifted
active_tab_foreground      #1d2021
active_tab_background      #458588
inactive_tab_foreground    #a89984
inactive_tab_background    #3c3836
tab_bar_background         #282828

# ---------------------------------------------------------------------------
# Colors — Catppuccin Mocha (your existing) + Sea Shells transferred from Ptyxis
# ---------------------------------------------------------------------------
# Default: Catppuccin Mocha (your kitty.conf 2025-11-30). Full 16-color expansion below.
# To switch to Ptyxis Sea Shells theme instantly:
#   kitty +kitten themes --reload-in=all Sea Shells
#   or:  include themes/SeaShells.conf
# The file themes/SeaShells.conf contains the exact Ptyxis palette (#09141B etc.)
# The file themes/Catppuccin-Mocha.conf preserves this palette as backup.

foreground              #d5c4a1
background              #282828
selection_foreground    #ebdbb2
selection_background    #504945
cursor                  #928374
cursor_text_color       #282828
url_color               #458588
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# Full Catppuccin Mocha 16-color palette (expanded from your minimal config)
color0                  #32302f
color1                  #cc241d
color2                  #98971a
color3                  #d79921
color4                  #458588
color5                  #b16286
color6                  #689d6a
color7                  #a89984
color8                  #928374
color9                  #fb4934
color10                 #b8bb26
color11                 #fabd2f
color12                 #83a598
color13                 #d3869b
color14                 #8ec07c
color15                 #ebdbb2

# Mark 1 match is darkest Catppuccin surface for GPU-friendly contrast
mark1_foreground        #1E1E2E
mark1_background        #F38BA8
mark2_foreground        #1E1E2E
mark2_background        #A6E3A1
mark3_foreground        #1E1E2E
mark3_background        #89B4FA

# ---------------------------------------------------------------------------
# Advanced GPU / Rendering tweaks
# ---------------------------------------------------------------------------
# Allow kitty to use GPU for image/unicode rendering at full resolution
allow_hyperlinks        yes
detect_urls             yes
url_style               curly
underline_hyperlinks    always

# Performance: single-instance enabled via ~/.local/share/applications/kitty.desktop Exec=kitty --single-instance
# Shares GPU sprite cache, instant 2nd window (saves ~150ms fork + 10MB)
# single_instance is a CLI flag, not a config option — see kitty --help

# Reduce CPU wakeups
editor                  nvim
close_on_child_death    no
enabled_layouts         splits,stack,tall,fat,grid,horizontal,vertical

# Terminfo — advertise full kitty capabilities for GPU-aware apps
term                    xterm-kitty

# ---------------------------------------------------------------------------
# Keybindings — workflow speed (efficient splits/tabs/navigation)
# ---------------------------------------------------------------------------
kitty_mod                  ctrl+shift
# Splits — cwd-aware (fastest workflow, no cd needed)
map kitty_mod+enter new_window_with_cwd
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+d     new_window_with_cwd
# Layout & window management
map kitty_mod+l     next_layout
map kitty_mod+z     toggle_layout stack
map kitty_mod+1     first_window
map kitty_mod+2     second_window
# Tab navigation — alt+number (like browser)
map alt+1           goto_tab 1
map alt+2           goto_tab 2
map alt+3           goto_tab 3
map alt+4           goto_tab 4
# MRU toggle — jump to most recently used tab, press again to jump back
# Native MRU (no remote needed): goto_tab 0 == previous active tab (kitty native, fastest)
map ctrl+tab        goto_tab 0
# Alternative remote-control version (requires allow_remote_control yes):
# map ctrl+tab        remote_control focus-tab --match recent:1
# Move tabs without mouse (fallback for Wayland drag bug)
map alt+shift+Right move_tab_forward
map alt+shift+Left  move_tab_backward
# Quick config reload / debug
map kitty_mod+f6    debug_config
map kitty_mod+f5    load_config_file
# Close tab — Ctrl+Q (requested)
map ctrl+q          close_tab
# Fullscreen — explicit + browser-style F11 fallback
map ctrl+shift+f11  toggle_fullscreen
map f11             toggle_fullscreen

# ---------------------------------------------------------------------------
# Theme switcher include (uncomment to use Sea Shells by default)
# ---------------------------------------------------------------------------
# include themes/SeaShells.conf
