# fuzzel — Gruvbox dark (muted), matching Waybar / dunst / kitty / zathura
[main]
font=JetBrainsMono Nerd Font:size=11
terminal=kitty -e
prompt="  "
placeholder=Search
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=40
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=22
fields=filename,name,generic,keywords
match-mode=fzf
sort-result=yes
show-actions=no
exit-on-keyboard-focus-loss=yes

[colors]
background=282828db
text=a89984ff
prompt=d65d0eff
placeholder=7c6f64ff
input=d5c4a1ff
match=d79921ff
selection=3c3836ff
selection-text=d5c4a1ff
selection-match=d79921ff
counter=7c6f64ff
border=504945ff

[border]
width=1
radius=0

[dmenu]
exit-immediately-if-empty=yes
