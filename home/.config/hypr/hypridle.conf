# hypridle — lock, dim, screen off and suspend on idle

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false            # videos / Firefox fullscreen keep the screen awake
}

# 4 min: dim screen and keyboard backlight
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}
listener {
    timeout = 240
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: screen off
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 20 min: suspend, on battery only
listener {
    timeout = 1200
    on-timeout = [ "$(cat /sys/class/power_supply/ADP1/online)" = 0 ] && systemctl suspend
}
