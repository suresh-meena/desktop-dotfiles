# hyprlock — Gruvbox dark (muted), matching the desktop
# Clear the password: Esc, Ctrl+U or Ctrl+Backspace

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/suresh/Pictures/Wallpapers/sunset-gruvbox.jpg
    color = rgb(282828)
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.1
}

# time
label {
    monitor =
    text = $TIME
    color = rgb(d5c4a1)
    font_size = 84
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a89984)
    font_size = 16
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    inner_color = rgba(282828e6)
    outer_color = rgb(504945)
    check_color = rgb(d79921)
    fail_color = rgb(cc241d)
    capslock_color = rgb(d65d0e)
    font_color = rgb(d5c4a1)
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##7c6f64">  password</span>
    fail_text = <span foreground="##cc241d">$FAIL ($ATTEMPTS)</span>
    check_text = <span foreground="##d79921">checking…</span>

    position = 0, -20
    halign = center
    valign = center
}

# user
label {
    monitor =
    text =   $USER
    color = rgb(7c6f64)
    font_size = 12
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}
