# Shared by mpv and Celluloid (Celluloid loads this via its mpv-config-file setting)

# --- hardware decoding: Intel VA-API whenever possible, software fallback otherwise ---
hwdec=vaapi                      # Intel iHD (UHD 620); keeps the NVIDIA MX250 asleep
vaapi-device=/dev/dri/renderD128
hwdec-codecs=all                 # try hardware for every codec the GPU supports
vo=gpu-next
gpu-context=wayland
gpu-api=opengl

# --- battery-friendly defaults ---
video-sync=audio
interpolation=no
profile=fast                     # cheap scaling; the iGPU does the heavy lifting

# --- convenience ---
save-position-on-quit=yes
keep-open=yes
screenshot-directory=~/Pictures/Screenshots
