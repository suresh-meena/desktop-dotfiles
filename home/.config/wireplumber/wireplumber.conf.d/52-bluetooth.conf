# Bluetooth headphones: best available quality.
#   sbc-xq: high-bitrate SBC for devices without LDAC/aptX/AAC
#   msbc:   wide-band (clearer) microphone in calls
#   hw-volume: the headphones' own volume buttons stay in sync
# LDAC, aptX and AAC are already on and are picked automatically when supported.
monitor.bluez.properties = {
    bluez5.enable-sbc-xq = true
    bluez5.enable-msbc = true
    bluez5.enable-hw-volume = true
}
