# Monitor (HDMI) sound: keep the output open, so the start of each sound
# (notification, first second of a video) is not cut off while it wakes up.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
